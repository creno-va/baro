name: ADR 제안
description: 되돌리기 어렵거나 여러 모듈에 영향을 주는 기술 결정을 제안합니다.
title: "[ADR] "
labels: []
body:
  - type: textarea
    id: context
    attributes:
      label: 맥락과 문제
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: 제안 결정
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 고려한 대안
    validations:
      required: true
  - type: textarea
    id: consequences
    attributes:
      label: 긍정적 결과, 비용과 위험
    validations:
      required: true
  - type: textarea
    id: migration
    attributes:
      label: 전환·롤백 계획
  - type: checkboxes
    id: adr_check
    attributes:
      label: 확인
      options:
        - label: 기존 Accepted ADR과 충돌 여부를 확인했습니다.
          required: true
        - label: 제품 범위 변경이면 PRD 변경도 포함했습니다.
          required: true
