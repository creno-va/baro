name: Deploy preview

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Full 40-character current main SHA with successful CI
        required: true
        type: string

permissions:
  contents: read
  actions: read
  deployments: write

concurrency:
  group: cloudflare-preview
  cancel-in-progress: false

jobs:
  deploy:
    name: Cloudflare preview
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: preview
    env:
      TARGET_SHA: ${{ inputs.target_sha }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 9e844969d0c44b2449f3951d1f301654
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Validate immutable release SHA
        run: |
          [[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$TARGET_SHA"

      - name: Checkout verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun ci

      - name: Verify successful main CI
        run: bun scripts/verify-release.ts "$TARGET_SHA" --ci-only

      - name: Build and deploy verified release
        uses: ./.github/actions/deploy-worker
        with:
          target-environment: preview
          release-sha: ${{ inputs.target_sha }}
          public-beta-enabled: 'false'
        env:
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
          PUBLIC_API_MODE: real
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Record verified preview deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ inputs.target_sha }}
        run: |
          deployment_id=$(gh api --method POST "repos/$GITHUB_REPOSITORY/deployments" \
            -f ref="$RELEASE_SHA" -f environment=preview -F auto_merge=false \
            -F production_environment=false -F transient_environment=false -f 'required_contexts[]' --jq .id)
          gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses" \
            -f state=success -f environment_url=https://preview.baro.site \
            -f description='Release, schema and endpoint smoke passed' -F auto_inactive=false
