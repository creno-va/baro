name: Full validation (manual)

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Full 40-character main SHA to validate (no paid external calls)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: full-validation-${{ inputs.target_sha }}
  cancel-in-progress: false

jobs:
  validation:
    name: Full validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.ref == 'refs/heads/main'
    env:
      TARGET_SHA: ${{ inputs.target_sha }}
    steps:
      - name: Validate explicit candidate input
        run: '[[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]]'
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify actual checkout and main ancestry
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git merge-base --is-ancestor "$TARGET_SHA" origin/main
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install frozen dependencies and browser
        run: |
          bun ci
          bunx playwright install --with-deps chromium
      - name: Install pinned PDF verification dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/baro-full-python"
          "$RUNNER_TEMP/baro-full-python/bin/python" -m pip install --require-hashes --only-binary=:all: -r tests/browser/requirements.txt
          echo "$RUNNER_TEMP/baro-full-python/bin" >> "$GITHUB_PATH"
      - name: Secret scanner (pinned binary, full committed history, fully redacted)
        shell: bash
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          mkdir /tmp/baro-gitleaks
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/baro-gitleaks
          echo "/tmp/baro-gitleaks" >> "$GITHUB_PATH"

      - name: Run explicit full validation
        run: bun run validate:full
      - name: Record actual tested candidate
        run: bun scripts/full-validation-receipt.ts
      - name: Save successful full validation receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-accessibility-preview-${{ inputs.target_sha }}
          path: .wrangler/release/full-validation.json
          if-no-files-found: error
          retention-days: 30
      - name: Non-sensitive deterministic eval evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deterministic-eval-${{ inputs.target_sha }}
          path: .wrangler/eval/*.json
          if-no-files-found: ignore
          retention-days: 14
