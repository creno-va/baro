name: Full validation (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Full validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install frozen dependencies and browser
        run: |
          bun ci
          bunx playwright install --with-deps chromium
      - name: Secret scanner (pinned binary, full committed history, fully redacted)
        shell: bash
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          mkdir /tmp/baro-gitleaks
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/baro-gitleaks
          echo "/tmp/baro-gitleaks" >> "$GITHUB_PATH"

      - name: Run explicit full validation
        run: bun run validate:full
      - name: Non-sensitive deterministic eval evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: deterministic-eval-${{ github.sha }}
          path: .wrangler/eval/*.json
          if-no-files-found: ignore
          retention-days: 14
