name: Mobile native builds (manual)

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Full 40-character main SHA to build (preview, no store signing or deployment)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mobile-native-${{ inputs.target_sha }}
  cancel-in-progress: false

jobs:
  native:
    name: Mobile ${{ matrix.platform }} development build
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            runner: ubuntu-latest
          - platform: ios
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      TARGET_SHA: ${{ inputs.target_sha }}
      EXPO_PUBLIC_APP_ENV: preview
      EXPO_PUBLIC_API_URL: https://preview.baro.site
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - name: Validate candidate
        shell: bash
        run: '[[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]]'
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify candidate ancestry
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git merge-base --is-ancestor "$TARGET_SHA" origin/main
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: apps/mobile/.node-version
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Setup Java
        if: matrix.platform == 'android'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Install frozen dependencies
        run: bun ci
      - name: Attest installed toolchain patches and actual consumers
        run: bun run security:patches
      - name: Verify source and Metro bundles
        run: |
          bun run mobile:check
          bun run mobile:bundle
      - name: Verify Android SDK signature API before native compile
        if: matrix.platform == 'android'
        run: bun scripts/mobile-preview-artifact.ts android --preflight
      - name: Compile native development app
        run: bun run mobile:native ${{ matrix.platform }}
      - name: Package preview development app and actual binary identity
        run: bun scripts/mobile-preview-artifact.ts ${{ matrix.platform }}
      - name: Record build identity
        shell: bash
        run: |
          mkdir -p .wrangler/mobile-build
          node -e 'const fs=require("node:fs"); const p=require("./apps/mobile/package.json"); const assets=JSON.parse(fs.readFileSync(".wrangler/mobile-build/assets-${{ matrix.platform }}.json","utf8")); fs.writeFileSync(".wrangler/mobile-build/receipt-${{ matrix.platform }}.json", JSON.stringify({sourceSha:process.env.TARGET_SHA, platform:"${{ matrix.platform }}", environment:"preview", apiOrigin:process.env.EXPO_PUBLIC_API_URL, version:p.version, expo:p.dependencies.expo, reactNative:p.dependencies["react-native"], kind:"development-debug", assets, appRuntimeVerified:false, storeSigned:false, deployed:false}, null, 2)+"\n")'
      - name: Save build receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-${{ matrix.platform }}-${{ inputs.target_sha }}
          path: .wrangler/mobile-build/receipt-${{ matrix.platform }}.json
          if-no-files-found: error
      - name: Save preview development app for internal testing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-preview-development-${{ matrix.platform }}-${{ inputs.target_sha }}
          path: |
            .wrangler/mobile-handoff/baro-preview-*.apk
            .wrangler/mobile-handoff/baro-preview-*.zip
            .wrangler/mobile-handoff/receipt-${{ matrix.platform }}.json
          if-no-files-found: error
