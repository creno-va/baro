name: Environment readiness

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: Worker metadata to inspect using read-only requests
        type: choice
        options:
          - preview
          - production
        default: preview
      check_legal:
        description: Preview only; recheck official legal API after credential or approval changes
        type: boolean
        default: false
      check_gateway:
        description: Recheck Gateway metadata only after token read permission changes
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ inputs.target_environment }}-readiness
  cancel-in-progress: false

jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: preview
      deployment: false
    steps:
      - name: Checkout main candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install frozen dependencies
        run: bun ci
      - name: Read selected environment metadata only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          READINESS_CANDIDATE_SHA: ${{ github.sha }}
          READINESS_TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          READINESS_CHECK_GATEWAY: ${{ inputs.check_gateway }}
        run: bun scripts/environment-readiness.ts
      - name: Verify v2 official law precedent and guide integrity
        if: always() && inputs.check_legal && inputs.target_environment == 'preview'
        env:
          LAW_API_OC: ${{ secrets.LAW_API_OC }}
          READINESS_CANDIDATE_SHA: ${{ github.sha }}
        run: bun scripts/legal-readiness.ts
      - name: Save allowlisted readiness observation
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v7.0.1
        with:
          name: ${{ inputs.target_environment }}-readiness-${{ github.sha }}
          path: |
            .wrangler/readiness/${{ inputs.target_environment }}.json
            .wrangler/readiness/legal.json
          if-no-files-found: error
          retention-days: 7
