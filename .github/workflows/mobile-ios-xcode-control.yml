name: Mobile iOS Xcode signing control (manual)

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Full main SHA; Xcode Simulator ad-hoc control only, no Apple account or store upload
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: mobile-ios-xcode-control-${{ inputs.target_sha }}
  cancel-in-progress: false

jobs:
  control:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 55
    env:
      TARGET_SHA: ${{ inputs.target_sha }}
      EXPO_PUBLIC_APP_ENV: preview
      EXPO_PUBLIC_API_URL: https://preview.baro.site
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - run: '[[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false
          fetch-depth: 0
      - run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git merge-base --is-ancestor "$TARGET_SHA" origin/main
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: apps/mobile/.node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun ci
      - run: bun run security:patches
      - name: Verify successful immutable candidate CI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun scripts/verify-release.ts "$TARGET_SHA" --ci-only
      - run: node scripts/mobile-runtime-ios-launch.cjs --self-test
      - name: Compile isolated signing control with actual Xcode
        run: |
          mkdir -p .wrangler/ios-xcode-control
          if bun scripts/mobile-native-build.ts ios --xcode-control > .wrangler/ios-xcode-control/private-build.log 2>&1; then
            echo 'XCODE_SIMULATOR_CONTROL_COMPILED'
          else
            bun -e 'const s=await Bun.file(".wrangler/ios-xcode-control/private-build.log").text();const code=/requires a development team/i.test(s)?"XCODE_CONTROL_TEAM_REQUIRED":/provisioning profile/i.test(s)?"XCODE_CONTROL_PROFILE_REQUIRED":/signing certificate/i.test(s)?"XCODE_CONTROL_IDENTITY_REQUIRED":"XCODE_CONTROL_BUILD_FAILED";await Bun.write(".wrangler/ios-xcode-control/failure.json",JSON.stringify({sourceSha:process.env.TARGET_SHA,phase:"compile-and-signing-control",code,physicalDeviceVerified:false,storeSigned:false,deployed:false},null,2)+"\n");console.error(code);process.exitCode=1;'
          fi
      - name: Preserve compiled control identity and archive
        run: bun scripts/mobile-preview-artifact.ts ios
      - name: Observe existing real SDK factories on a fresh owned Simulator
        run: bun scripts/mobile-ios-keychain-host.ts --xcode-control
      - name: Save scoped control observations and compiled binary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-ios-xcode-control-${{ inputs.target_sha }}
          path: |
            .wrangler/ios-xcode-control/failure.json
            .wrangler/mobile-build/xcode-control-ios.json
            .wrangler/mobile-handoff/receipt-ios.json
            .wrangler/mobile-handoff/baro-preview-ios-simulator-*.zip
            .wrangler/ios-keychain-host/baseline.json
            .wrangler/ios-keychain-host/receipt.json
            .wrangler/ios-keychain-host/failure.json
          if-no-files-found: warn
