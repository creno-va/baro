name: Inspect finite workspace diagnostics

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: Existing environment to read; no writes or provider calls
        type: choice
        default: preview
        options: [preview, production]
      expected_live_sha:
        description: Full SHA currently serving the selected environment
        type: string
        required: true
      workspace_id:
        description: Existing synthetic workspace UUID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ inputs.target_environment }}
  cancel-in-progress: false

jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ inputs.target_environment }}
      deployment: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install frozen dependencies
        run: bun ci
      - name: Read allowlisted metadata without case decryption or mutations
        env:
          INSPECT_ENVIRONMENT: ${{ inputs.target_environment }}
          RECOVERY_EXPECTED_LIVE_SHA: ${{ inputs.expected_live_sha }}
          INSPECT_WORKSPACE_ID: ${{ inputs.workspace_id }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun scripts/inspect-production-workspace.ts
      - name: Save finite diagnostics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workspace-inspection-${{ github.run_id }}
          path: .wrangler/readiness/production-inspection.json
          if-no-files-found: error
          retention-days: 7
