name: Mobile Android IME metadata reference (manual)

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Full green main tooling SHA; fresh SDK image, no product app or account
        required: true
        type: string
      mode:
        description: Registered metadata, or fixed public Gboard Settings menu counts; no language selection or product input
        required: false
        default: metadata
        type: choice
        options:
          - metadata
          - settings

permissions:
  contents: read
  actions: read

concurrency:
  group: mobile-android-ime-reference-${{ inputs.target_sha }}
  cancel-in-progress: false

jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TARGET_SHA: ${{ inputs.target_sha }}
      BARO_ANDROID_IME_REFERENCE_MODE: ${{ inputs.mode || 'metadata' }}
      EXPO_PUBLIC_APP_ENV: preview
      EXPO_PUBLIC_API_URL: https://preview.baro.site
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - run: '[[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false
          fetch-depth: 0
      - run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git merge-base --is-ancestor "$TARGET_SHA" origin/main
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: apps/mobile/.node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - run: bun ci
      - run: bun run security:patches
      - name: Verify successful immutable candidate CI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun scripts/verify-release.ts "$TARGET_SHA" --ci-only
      - name: Prepare owned Android SDK image
        run: |
          sudo chmod a+rw /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'emulator' 'system-images;android-35;google_apis;x86_64'
      - name: Inspect IME registration on a fresh product-free Emulator
        run: bun scripts/mobile-android-ime-reference.ts
      - name: Preserve only fixed metadata, counters and cleanup fields
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-android-ime-reference-${{ inputs.target_sha }}
          path: |
            .wrangler/mobile-android-ime-reference/receipt.json
            .wrangler/mobile-android-ime-reference/failure.json
            .wrangler/mobile-android-ime-reference/cleanup.json
          if-no-files-found: warn
