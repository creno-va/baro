name: Mobile iOS SDK keychain host (manual)

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Immutable main tooling/JS SHA; uses the pinned public Simulator binary only
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: mobile-ios-keychain-host-${{ inputs.target_sha }}
  cancel-in-progress: false

jobs:
  readiness:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 20
    env:
      TARGET_SHA: ${{ inputs.target_sha }}
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - run: '[[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false
          fetch-depth: 0
      - run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git merge-base --is-ancestor "$TARGET_SHA" origin/main
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: apps/mobile/.node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun ci
      - run: bun run security:patches
      - name: Verify successful candidate CI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun scripts/verify-release.ts "$TARGET_SHA" --ci-only
      - name: Resolve pinned public binary input
        id: binary
        run: |
          bun -e 'import{iosHostBinarySchema}from"./scripts/mobile-ios-keychain-host";const m=iosHostBinarySchema.parse(await Bun.file("tests/fixtures/ios-host-binary.json").json());await Bun.write(process.env.GITHUB_OUTPUT,`run=${m.workflowRunId}\nartifact=${m.artifactName}\n`);'
      - name: Download pinned public development app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BINARY_RUN_ID: ${{ steps.binary.outputs.run }}
          BINARY_ARTIFACT: ${{ steps.binary.outputs.artifact }}
        run: gh run download "$BINARY_RUN_ID" --name "$BINARY_ARTIFACT" --dir .wrangler/ios-keychain-input
      - name: Compare actual SDK readiness on the owned Simulator
        run: bun scripts/mobile-ios-keychain-host.ts
      - name: Save scoped safe observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-ios-keychain-host-${{ inputs.target_sha }}
          path: |
            .wrangler/ios-keychain-host/receipt.json
            .wrangler/ios-keychain-host/failure.json
            .wrangler/ios-keychain-host/baseline.json
            .wrangler/ios-keychain-host/signed.json
            .wrangler/ios-keychain-host/signing.json
          if-no-files-found: warn
