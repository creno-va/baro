name: Mobile preserved Xcode SDK control (manual)

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Full main tooling SHA; pinned Simulator compiler output, no recompilation or resigning
        required: true
        type: string
      full_runtime:
        description: Also run instrumented Home and native large IO against the loopback fixture
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: mobile-ios-xcode-reverify-${{ inputs.target_sha }}
  cancel-in-progress: false

jobs:
  readiness:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 55
    env:
      TARGET_SHA: ${{ inputs.target_sha }}
      EXPO_PUBLIC_APP_ENV: preview
      EXPO_PUBLIC_API_URL: https://preview.baro.site
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - run: '[[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false
          fetch-depth: 0
      - run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git merge-base --is-ancestor "$TARGET_SHA" origin/main
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: apps/mobile/.node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun ci
      - run: bun run security:patches
      - name: Verify successful immutable tooling CI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun scripts/verify-release.ts "$TARGET_SHA" --ci-only
      - name: Resolve pinned compiler input
        id: input
        run: |
          bun -e 'import{xcodeCompilerInputSchema}from"./scripts/mobile-ios-xcode-input";const m=xcodeCompilerInputSchema.parse(await Bun.file("tests/fixtures/ios-xcode-compiler-input.json").json());await Bun.write(process.env.GITHUB_OUTPUT,`artifact=${m.artifactId}\n`);'
      - name: Download original compiled Simulator app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_ARTIFACT_ID: ${{ steps.input.outputs.artifact }}
        run: |
          mkdir -p .wrangler/ios-xcode-input
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$INPUT_ARTIFACT_ID" > .wrangler/private-xcode-artifact.json
          bun -e 'const p=await Bun.file("tests/fixtures/ios-xcode-compiler-input.json").json(),a=await Bun.file(".wrangler/private-xcode-artifact.json").json();if(String(a.id)!==p.artifactId||a.name!==p.artifactName||a.expired||String(a.workflow_run?.id)!==p.workflowRunId||a.workflow_run?.head_sha!==p.sourceSha)throw Error("PINNED_XCODE_ARTIFACT_PROVENANCE_MISMATCH");'
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$INPUT_ARTIFACT_ID/zip" > .wrangler/private-xcode-input.zip
          unzip -q .wrangler/private-xcode-input.zip -d .wrangler/ios-xcode-input
      - run: node scripts/mobile-runtime-ios-launch.cjs --self-test
      - name: Verify actual host signature and both simulated entitlement sections
        run: bun scripts/mobile-ios-xcode-reverify.ts
      - name: Observe SDK readiness without changing the binary
        run: bun scripts/mobile-ios-keychain-host.ts --pinned-xcode-control
      - name: Execute Home and native IO using the original compiled binary
        if: inputs.full_runtime
        run: bun scripts/mobile-runtime.ts ios --pinned-xcode-control
      - name: Preserve scoped original-source observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-ios-xcode-reverified-${{ inputs.target_sha }}
          path: |
            .wrangler/ios-xcode-reverify/verification.json
            .wrangler/ios-xcode-reverify/failure.json
            .wrangler/mobile-build/xcode-control-ios.json
            .wrangler/mobile-handoff/receipt-ios.json
            .wrangler/mobile-handoff/baro-preview-ios-simulator-*.zip
            .wrangler/ios-keychain-host/baseline.json
            .wrangler/ios-keychain-host/receipt.json
            .wrangler/ios-keychain-host/failure.json
            .wrangler/mobile-runtime/home-ios.json
            .wrangler/mobile-runtime/receipt-ios.json
            .wrangler/mobile-runtime/failure-ios.json
            .wrangler/mobile-runtime/product-home-ios.png
            .wrangler/mobile-runtime/native-probe-ios.png
          if-no-files-found: warn
