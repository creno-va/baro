name: Prepare fresh D1 databases with ten synthetic lawyers (manual)

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Full current main SHA with successful CI
        required: true
        type: string
      confirmation:
        description: Type prepare-fresh-databases-with-ten-synthetic-lawyers
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: baro-fresh-application-data
  cancel-in-progress: false

jobs:
  preview:
    name: Prepare fresh preview D1
    if: github.ref == 'refs/heads/main' && github.sha == inputs.target_sha && inputs.confirmation == 'prepare-fresh-databases-with-ten-synthetic-lawyers' && (github.actor == 'hyunhomon' || github.actor == 'hwangeunchan') && (github.triggering_actor == 'hyunhomon' || github.triggering_actor == 'hwangeunchan')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: preview
      deployment: false
    steps:
      - name: Checkout explicit operator code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: apps/mobile/.node-version
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install frozen dependencies
        run: bun ci
      - name: Verify fresh database contracts
        run: bun test tests/fresh-application-data.test.ts
      - name: Verify current main and its CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          [[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$TARGET_SHA"
          bun scripts/verify-release.ts "$TARGET_SHA" --ci-only
      - name: Migrate fresh database and verify ten synthetic profiles
        env:
          CLOUDFLARE_ACCOUNT_ID: 9e844969d0c44b2449f3951d1f301654
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CASE_DATA_KEY_V1: ${{ secrets.CASE_DATA_KEY_V1 }}
          FRESH_ENVIRONMENT: preview
          FRESH_CONFIRMATION: ${{ inputs.confirmation }}
        run: bun scripts/fresh-application-data.ts
      - name: Save aggregate operator receipt only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: application-fresh-preview-${{ inputs.target_sha }}
          path: .wrangler/fresh/receipt-preview.json
          if-no-files-found: ignore
          retention-days: 30

  production:
    needs: preview
    name: Prepare fresh production D1
    if: github.ref == 'refs/heads/main' && github.sha == inputs.target_sha && inputs.confirmation == 'prepare-fresh-databases-with-ten-synthetic-lawyers' && (github.actor == 'hyunhomon' || github.actor == 'hwangeunchan') && (github.triggering_actor == 'hyunhomon' || github.triggering_actor == 'hwangeunchan')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      deployment: false
    steps:
      - name: Checkout explicit operator code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: apps/mobile/.node-version
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install frozen dependencies
        run: bun ci
      - name: Verify fresh database contracts
        run: bun test tests/fresh-application-data.test.ts
      - name: Verify current main and its CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          [[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$TARGET_SHA"
          bun scripts/verify-release.ts "$TARGET_SHA" --ci-only
      - name: Migrate fresh database and verify ten synthetic profiles
        env:
          CLOUDFLARE_ACCOUNT_ID: 9e844969d0c44b2449f3951d1f301654
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CASE_DATA_KEY_V1: ${{ secrets.CASE_DATA_KEY_V1 }}
          FRESH_ENVIRONMENT: production
          FRESH_CONFIRMATION: ${{ inputs.confirmation }}
        run: bun scripts/fresh-application-data.ts
      - name: Save aggregate operator receipt only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: application-fresh-production-${{ inputs.target_sha }}
          path: .wrangler/fresh/receipt-production.json
          if-no-files-found: ignore
          retention-days: 30
