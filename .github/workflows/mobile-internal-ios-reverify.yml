name: Mobile preserved bundled iOS preview (manual)

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Full main tooling SHA; pinned compiled product app, no recompilation
        required: true
        type: string
      smoke:
        description: Observe two cold launches and the anonymous initial screenshot without Metro
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: mobile-internal-ios-reverify-${{ inputs.target_sha }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 25
    env:
      TARGET_SHA: ${{ inputs.target_sha }}
      EXPO_PUBLIC_APP_ENV: preview
      EXPO_PUBLIC_API_URL: https://preview.baro.site
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - run: '[[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false
          fetch-depth: 0
      - run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git merge-base --is-ancestor "$TARGET_SHA" origin/main
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: apps/mobile/.node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun ci
      - run: bun run security:patches
      - name: Verify successful immutable tooling CI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun scripts/verify-release.ts "$TARGET_SHA" --ci-only
      - name: Resolve pinned compiler input
        id: input
        run: |
          bun -e 'import{iosInternalInputSchema}from"./scripts/mobile-internal-ios-input";const p=iosInternalInputSchema.parse(await Bun.file("tests/fixtures/ios-internal-preview.json").json());await Bun.write(process.env.GITHUB_OUTPUT,`artifact=${p.artifactId}\nrun=${p.workflowRunId}\n`);'
      - name: Verify successful compiler provenance and download original app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_ARTIFACT_ID: ${{ steps.input.outputs.artifact }}
          INPUT_RUN_ID: ${{ steps.input.outputs.run }}
        run: |
          mkdir -p .wrangler/mobile-internal-ios-input
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$INPUT_RUN_ID" > .wrangler/private-ios-compiler-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$INPUT_ARTIFACT_ID" > .wrangler/private-ios-compiler-artifact.json
          bun -e 'const p=await Bun.file("tests/fixtures/ios-internal-preview.json").json(),r=await Bun.file(".wrangler/private-ios-compiler-run.json").json(),a=await Bun.file(".wrangler/private-ios-compiler-artifact.json").json();if(String(r.id)!==p.workflowRunId||r.head_sha!==p.sourceSha||r.status!=="completed"||r.conclusion!=="success"||r.path!==".github/workflows/mobile-internal-ios.yml"||String(a.id)!==p.artifactId||a.name!==p.artifactName||a.expired||String(a.workflow_run?.id)!==p.workflowRunId||a.workflow_run?.head_sha!==p.sourceSha)throw Error("INTERNAL_IOS_COMPILER_PROVENANCE_MISMATCH");'
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$INPUT_ARTIFACT_ID/zip" > .wrangler/private-ios-compiler-input.zip
          unzip -q .wrangler/private-ios-compiler-input.zip -d .wrangler/mobile-internal-ios-input
      - name: Reverify original metadata and optionally observe anonymous cold launches
        env:
          OBSERVE_HOME: ${{ inputs.smoke }}
        run: |
          args=()
          if [ "$OBSERVE_HOME" = "true" ]; then args+=(--home); fi
          bun scripts/mobile-internal-ios-reverify.ts "${args[@]}"
          if [ "$OBSERVE_HOME" = "true" ]; then
            test -s .wrangler/mobile-internal-ios-reverify/home.json
            test -s .wrangler/mobile-internal-ios-reverify/home-ios.png
          fi
      - name: Preserve scoped unchanged binary and observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-internal-ios-reverified-${{ inputs.target_sha }}
          path: |
            .wrangler/mobile-internal-ios-reverify/verification.json
            .wrangler/mobile-internal-ios-reverify/receipt-ios.json
            .wrangler/mobile-internal-ios-reverify/baro-internal-preview-ios-simulator-*.zip
            .wrangler/mobile-internal-ios-reverify/home.json
            .wrangler/mobile-internal-ios-reverify/home-ios.png
            .wrangler/mobile-internal-ios-reverify/failure.json
          if-no-files-found: warn
