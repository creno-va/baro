name: Deploy production

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type production to deploy the verified release SHA
        required: true
        type: string
      target_sha:
        description: Full 40-character SHA with successful main CI and preview smoke
        required: true
        type: string
      release_mode:
        description: Foundation keeps public APIs closed; public-beta requires release evidence
        required: true
        default: foundation
        type: choice
        options:
          - foundation
          - public-beta
          - operator-authorized
      launch_authorization_comment:
        description: Issue 71 comment receipt for explicit operator launch authorization of this exact SHA
        type: string
        default: ''
      configure_ai:
        description: Apply verified AI bounds, pricing, funding and real two-environment budget coordination
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  deployments: write

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Cloudflare production
    if: github.event.inputs.confirmation == 'production' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: 9e844969d0c44b2449f3951d1f301654
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TARGET_SHA: ${{ inputs.target_sha }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Validate immutable release SHA
        run: '[[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]]'

      - name: Checkout verified release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install and verify release evidence
        run: |
          bun ci
          bun scripts/verify-release.ts "$TARGET_SHA"

      - name: Check public beta release evidence
        if: inputs.release_mode == 'public-beta'
        run: bun run release:check

      - name: Check explicit operator launch authorization
        if: inputs.release_mode == 'operator-authorized'
        env:
          LAUNCH_AUTHORIZATION_COMMENT: ${{ inputs.launch_authorization_comment }}
        run: bun scripts/verify-launch-authorization.ts "$TARGET_SHA" "$LAUNCH_AUTHORIZATION_COMMENT"

      - name: Build and deploy verified release
        uses: ./.github/actions/deploy-worker
        with:
          target-environment: production
          release-sha: ${{ inputs.target_sha }}
          public-beta-enabled: ${{ (inputs.release_mode == 'public-beta' || inputs.release_mode == 'operator-authorized') && 'true' || 'false' }}
          configure-ai: ${{ inputs.configure_ai }}
        env:
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
          PUBLIC_API_MODE: real
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
