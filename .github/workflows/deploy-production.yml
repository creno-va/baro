name: Deploy production

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type production to deploy the verified release SHA
        required: true
        type: string
      target_sha:
        description: Full 40-character SHA with successful main CI and preview smoke
        required: true
        type: string
      release_mode:
        description: Foundation keeps public APIs closed; public-beta requires release evidence
        required: true
        default: foundation
        type: choice
        options:
          - foundation
          - public-beta
      sync_oauth:
        description: Apply the six production Environment OAuth credentials to the production Worker
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  deployments: write

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Cloudflare production
    if: github.event.inputs.confirmation == 'production' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: 9e844969d0c44b2449f3951d1f301654
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TARGET_SHA: ${{ inputs.target_sha }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Validate immutable release SHA
        run: '[[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]]'

      - name: Checkout verified release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false

      - name: Detect deployable application
        id: application
        shell: bash
        run: |
          if [[ -f package.json ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Application has not been scaffolded; production deployment skipped."
          fi

      - name: Validate deployment configuration
        if: steps.application.outputs.present == 'true'
        shell: bash
        run: |
          test -f bun.lock || {
            echo "::error::bun.lock is required."
            exit 1
          }
          if [[ ! -f wrangler.jsonc && ! -f wrangler.json && ! -f wrangler.toml ]]; then
            echo "::error::Wrangler configuration is required."
            exit 1
          fi
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN in the production GitHub Environment."
            exit 1
          fi

      - name: Setup Bun
        if: steps.application.outputs.present == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install, test and build
        if: steps.application.outputs.present == 'true'
        run: |
          bun ci
          bun scripts/verify-release.ts "$TARGET_SHA"
          bun run check
          bun run build:production
          bun run bundle:check
          bun run cf:dry-run

      - name: Check public beta release evidence
        if: inputs.release_mode == 'public-beta'
        run: bun run release:check

      - name: Validate requested production OAuth credentials
        if: steps.application.outputs.present == 'true' && inputs.sync_oauth
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
        shell: bash
        run: |
          for name in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET NAVER_CLIENT_ID NAVER_CLIENT_SECRET KAKAO_CLIENT_ID KAKAO_CLIENT_SECRET; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing production Environment OAuth credential: $name"
              exit 1
            fi
          done

      - name: Apply validated production migrations
        if: steps.application.outputs.present == 'true'
        run: bun run db:migrate:production

      - name: Deploy production
        if: steps.application.outputs.present == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          environment: production
          wranglerVersion: "4.147.0"
          command: deploy --var RELEASE_SHA:${{ inputs.target_sha }} --var PUBLIC_BETA_ENABLED:${{ inputs.release_mode == 'public-beta' && 'true' || 'false' }}
          secrets: |
            ${{ inputs.sync_oauth && 'GOOGLE_CLIENT_ID' || '' }}
            ${{ inputs.sync_oauth && 'GOOGLE_CLIENT_SECRET' || '' }}
            ${{ inputs.sync_oauth && 'NAVER_CLIENT_ID' || '' }}
            ${{ inputs.sync_oauth && 'NAVER_CLIENT_SECRET' || '' }}
            ${{ inputs.sync_oauth && 'KAKAO_CLIENT_ID' || '' }}
            ${{ inputs.sync_oauth && 'KAKAO_CLIENT_SECRET' || '' }}
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}

      - name: Verify deployed production release
        if: steps.application.outputs.present == 'true'
        run: bun scripts/smoke.ts https://baro.site "$TARGET_SHA"
