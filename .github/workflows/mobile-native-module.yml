name: Mobile native module verification

on:
  pull_request:
    paths:
      - apps/mobile/modules/**
      - tests/native/mobile-download/**
      - scripts/mobile-native-download-probe.ts
      - scripts/mobile-native-build.ts
      - scripts/mobile-ios-compile-verification.ts
      - scripts/mobile-native-assets.ts
      - .github/workflows/mobile-native-module.yml

permissions:
  contents: read

concurrency:
  group: native-module-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  compile:
    name: Native module ${{ matrix.id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            id: android
            architecture: ""
            runner: ubuntu-latest
          - platform: ios
            id: ios-arm64
            architecture: arm64
            runner: macos-26
          - platform: ios
            id: ios-x86_64
            architecture: x86_64
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      EXPO_PUBLIC_APP_ENV: preview
      EXPO_PUBLIC_API_URL: https://preview.baro.site
      EXPO_NO_TELEMETRY: "1"
      CI: "1"
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      VERIFICATION_ID: ${{ matrix.id }}
      IOS_VERIFICATION_ARCH: ${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: apps/mobile/.node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Setup Java
        if: matrix.platform == 'android'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - run: bun ci
      - name: Compile exact PR native source
        shell: bash
        run: |
          if [[ "${{ matrix.platform }}" == "ios" ]]; then
            bun run mobile:native ios --verify-architecture=${{ matrix.architecture }}
          else
            bun run mobile:native android
          fi
      - name: Android bounded native HTTP and file IO with 128MiB heap
        if: matrix.platform == 'android'
        working-directory: apps/mobile/android
        run: |
          ./gradlew :baro-private-download:testDebugUnitTest --no-daemon
          test -s ../modules/baro-private-download/android/build/test-results/testDebugUnitTest/TEST-site.baro.download.DiskTransferStoreTest.xml
          python3 - <<'PYTHON'
          import json, pathlib, xml.etree.ElementTree as ET
          report=ET.parse('../modules/baro-private-download/android/build/test-results/testDebugUnitTest/TEST-site.baro.download.DiskTransferStoreTest.xml').getroot()
          receipts=[]; uploads=[]
          for node in report.iter('system-out'):
            for line in (node.text or '').splitlines():
              if line.startswith('{"platform":"JVM-native-core"'):
                receipts.append(json.loads(line))
              if line.startswith('{"platform":"JVM-native-upload-core"'):
                uploads.append(json.loads(line))
          assert {r['size'] for r in receipts} == {100000000,1000000000}
          assert all(r['maxHeapBytes'] <= 134217728 and r['maxCopyBytes'] <= 65536 and not r['appDeviceAcceptance'] for r in receipts)
          assert len(uploads) == 1 and uploads[0]['size'] == 100000000
          assert all(r['maxHeapBytes'] <= 134217728 and r['maxCopyBytes'] <= 65536 and not r['appDeviceAcceptance'] for r in uploads)
          target=pathlib.Path('../../../.wrangler/mobile-native-pr')
          target.mkdir(parents=True,exist_ok=True)
          (target/'jvm-core.json').write_text(json.dumps({'platform':'JVM-native-core','receipts':receipts,'uploadReceipts':uploads},indent=2)+'\n')
          PYTHON
      - name: Apple native HTTP 100MB and 1GB bytes, memory and cleanup
        if: matrix.platform == 'ios'
        shell: bash
        run: |
          mkdir -p .wrangler/mobile-native-pr
          bun scripts/mobile-native-download-probe.ts --large | tee .wrangler/mobile-native-pr/apple-core.json
      - name: Record scoped verification receipt
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p .wrangler/mobile-native-pr
          node <<'NODE'
          const fs = require("node:fs");
          const {SOURCE_SHA:sourceSha, PLATFORM:platform, VERIFICATION_ID:id, IOS_VERIFICATION_ARCH:architecture} = process.env;
          if (!/^[a-f0-9]{40}$/.test(sourceSha) || !["android", "ios"].includes(platform)) throw Error("NATIVE_RECEIPT_IDENTITY_REQUIRED");
          let iosCompileVerification = null;
          if (platform === "ios") {
            iosCompileVerification = JSON.parse(fs.readFileSync(".wrangler/mobile-build/ios-verification-architecture.json", "utf8"));
            if (!["arm64", "x86_64"].includes(architecture) || id !== `ios-${architecture}` || iosCompileVerification.sourceSha !== sourceSha || iosCompileVerification.architecture !== architecture || iosCompileVerification.platform !== "ios-simulator" || iosCompileVerification.kind !== "single-architecture-compile-verification" || !iosCompileVerification.binaries?.length || iosCompileVerification.appRuntimeVerified !== false) throw Error("IOS_COMPILE_RECEIPT_MISMATCH");
          } else if (id !== "android" || architecture) throw Error("NATIVE_RECEIPT_IDENTITY_MISMATCH");
          fs.writeFileSync(`.wrangler/mobile-native-pr/receipt-${id}.json`, JSON.stringify({sourceSha, platform, kind:"pull-request-native-compile-and-core-probe", iosCompileVerification, compilePassed:true, coreProbePassed:true, appRuntimeVerified:false, storeSigned:false, deployed:false}, null, 2)+"\n", {flag:"wx"});
          NODE
      - name: Retain compile and core probe identity
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-module-${{ matrix.id }}-${{ github.event.pull_request.head.sha }}
          path: .wrangler/mobile-native-pr/*.json
          if-no-files-found: error
