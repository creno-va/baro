name: Report rendering

on:
  pull_request:
    paths:
      - "services/file-processor/**"
      - "src/components/reports/**"
      - "src/server/modules/reports/**"
      - "src/server/modules/rework/**"
      - "src/server/runtime/rework-*.ts"
      - "tests/rework-*.test.ts"
      - "scripts/report-native-fixture.ts"
      - "scripts/report-rework-fixture.ts"
      - "src/utils/report-*.ts"
      - "src/styles/reports.css"
      - "scripts/report-regressions.ts"
      - "tests/helpers/report*.ts*"
      - "tests/**/*report*.test.*"
      - ".github/workflows/report-rendering.yml"
  push:
    branches: [main]
    paths:
      - "services/file-processor/**"
      - "src/components/reports/**"
      - "src/server/modules/reports/**"
      - "src/server/modules/rework/**"
      - "src/server/runtime/rework-*.ts"
      - "tests/rework-*.test.ts"
      - "scripts/report-native-fixture.ts"
      - "scripts/report-rework-fixture.ts"
      - "src/utils/report-*.ts"
      - "src/styles/reports.css"
      - "scripts/report-regressions.ts"
      - "tests/helpers/report*.ts*"
      - "tests/**/*report*.test.*"
      - ".github/workflows/report-rendering.yml"

permissions:
  contents: read

concurrency:
  group: report-rendering-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: HTML/PDF native rendering
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun ci
      - name: Prepare synthetic application HTML
        run: |
          bun scripts/report-native-fixture.ts
          bun scripts/report-rework-fixture.ts
          chmod a+rwx .wrangler/report-native
          chmod a+rwx .wrangler/report-rework
      - name: Install pinned offline PDF verification dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/baro-report-python"
          "$RUNNER_TEMP/baro-report-python/bin/python" -m pip install --require-hashes --only-binary=:all: -r tests/browser/requirements.txt
          echo "$RUNNER_TEMP/baro-report-python/bin" >> "$GITHUB_PATH"
      - name: Build the pinned PDF runtime layer
        run: docker build --target office-runtime -f services/file-processor/Dockerfile -t baro-report-rendering .
      - name: Render and inspect offline PDF
        run: |
          docker run --rm --network none --user node --memory 6g --cpus 1 --pids-limit 128 --cap-drop ALL --read-only --tmpfs /tmp:rw,nosuid,nodev,size=256m \
            -e XDG_CACHE_HOME=/tmp \
            -v "$PWD/.wrangler/report-native:/report-fixture" \
            -v "$PWD/.wrangler/report-rework:/report-rework" \
            -v "$PWD/services/file-processor/report.py:/app/report.py:ro" \
            -v "$PWD/services/file-processor/server.mjs:/app/server.mjs:ro" \
            -v "$PWD/services/file-processor/report-test.py:/app/report-test.py:ro" \
            -v "$PWD/services/file-processor/report-rework-test.py:/app/report-rework-test.py:ro" \
            baro-report-rendering sh -c 'python3 /app/report-test.py && python3 /app/report-rework-test.py'
      - name: Report domain and export regressions on Linux
        run: bun scripts/report-regressions.ts
      - name: Actual native PDF and originals ZIP within report work limits
        env:
          BARO_REWORK_NATIVE_FIXTURE: "true"
          BARO_REPORT_EXPORT_ARTIFACT_DIR: .wrangler/report-export-budget
        run: bun test tests/reports-export-query-budget.test.ts
      - name: Retain synthetic PDF and rendered pages for visual review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report-rendering-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            .wrangler/report-native/report.pdf
            .wrangler/report-native/report-page-*.png
            .wrangler/report-rework/*.pdf
            .wrangler/report-rework/*-page-*.png
            .wrangler/report-export-budget/*
          if-no-files-found: error
          retention-days: 7
