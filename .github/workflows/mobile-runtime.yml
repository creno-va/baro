name: Mobile local runtime (manual)

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Immutable main SHA; isolated local emulator/simulator only
        required: true
        type: string

      platform:
        description: OS to verify; default both preserves two-OS acceptance
        required: true
        default: both
        type: choice
        options:
          - both
          - android
          - ios

permissions:
  contents: read

concurrency:
  group: mobile-runtime-${{ inputs.target_sha }}
  cancel-in-progress: false

jobs:
  runtime:
    name: Mobile ${{ matrix.platform }} local runtime
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platform == 'ios' && '["ios"]' || inputs.platform == 'android' && '["android"]' || '["android","ios"]') }}
    runs-on: ${{ matrix.platform == 'ios' && 'macos-26' || 'ubuntu-latest' }}
    timeout-minutes: 55
    env:
      TARGET_SHA: ${{ inputs.target_sha }}
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - name: Validate candidate
        shell: bash
        run: '[[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify candidate ancestry
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git merge-base --is-ancestor "$TARGET_SHA" origin/main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: apps/mobile/.node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare owned Android emulator runtime
        if: matrix.platform == 'android'
        shell: bash
        run: |
          sudo chmod a+rw /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'emulator' 'system-images;android-35;google_apis;x86_64'
      - run: bun ci
      - name: Attest installed toolchain patches and actual consumers
        run: bun run security:patches
      - name: Check pinned Expo simulator launch API before native compile
        if: matrix.platform == 'ios'
        run: node scripts/mobile-runtime-ios-launch.cjs --self-test
      - name: Compile and execute isolated local app
        run: bun run mobile:runtime ${{ matrix.platform }}
      - name: Save scoped runtime receipt and synthetic screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-runtime-${{ matrix.platform }}-${{ inputs.target_sha }}
          path: |
            .wrangler/mobile-runtime/receipt-${{ matrix.platform }}.json
            .wrangler/mobile-runtime/product-home-${{ matrix.platform }}.png
            .wrangler/mobile-runtime/native-probe-${{ matrix.platform }}.png
          if-no-files-found: error
      - name: Preserve observed Home separately when later native IO fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-home-only-${{ matrix.platform }}-${{ inputs.target_sha }}
          path: |
            .wrangler/mobile-runtime/home-${{ matrix.platform }}.json
            .wrangler/mobile-runtime/product-home-${{ matrix.platform }}.png
          if-no-files-found: ignore
      - name: Save safe failure classification
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-runtime-failure-${{ matrix.platform }}-${{ inputs.target_sha }}
          path: .wrangler/mobile-runtime/failure-${{ matrix.platform }}.json
          if-no-files-found: warn
      - name: Preserve signed local iOS compiler observations for independent reuse
        if: always() && matrix.platform == 'ios'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-runtime-local-ios-compiler-${{ inputs.target_sha }}
          path: |
            .wrangler/mobile-runtime/ios-local-compiler/inspection.json
            .wrangler/mobile-runtime/ios-local-compiler/failure.json
            .wrangler/mobile-runtime/ios-local-compiler/entitlement-shape-arm64.json
            .wrangler/mobile-runtime/ios-local-compiler/entitlement-shape-x86_64.json
            .wrangler/mobile-runtime/ios-local-compiler/unaccepted-local-simulator-*.zip
            .wrangler/mobile-runtime/ios-local-compiler/xcode-control-local-ios.json
          if-no-files-found: warn
